# Transparency
background_opacity 0.60
set_background_opactiy 1
inactive_text_alpha 0.8

# Optional
dynamic_background_opacity yes

# Hide window decorations
window_padding_width 1

# Font
font_family JetBrainsMono Nerd Font Mono
font_size 12

# Cursor
enable_cursor_trail true
cursor_shape block
cursor_trail_decay 0.1 0.4
cursor_trail 10
cursor_train_start_thrshold 0
cursor_blink true


# Bell
enable_audio_bell no

# Scrollback
scrollback_line 10000

enable_wayland_scaling no


shell zsh
shell_integration enabled
shell_integration no_cursor

# Color 
background #000000
foreground #E6E6E1

